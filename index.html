<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hanab • Play Hanabi Online!</title>
    <link rel="stylesheet" href="https://unpkg.com/tachyons@4/css/tachyons.min.css">
    <style>
        body { background-color: #00153f; color: white; font-family: sans-serif; margin: 0; }
        .bg-main-dark { background-color: #00153f; }
        .screen { display: none; }
        .screen.active { display: block; }
        
        /* Card styling mirroring hanab.cards dimensions */
        .card-box { width: 2.5rem; height: 3.5rem; border-radius: 0.25rem; display: flex; flex-direction: column; align-items: center; justify-content: center; position: relative; font-weight: bold; user-select: none; }
        .card-red { background-color: #e74c3c; color: #fff; border: 1px solid #c0392b; }
        .card-blue { background-color: #3498db; color: #fff; border: 1px solid #2980b9; }
        .card-green { background-color: #27ae60; color: #fff; border: 1px solid #1e8449; }
        .card-yellow { background-color: #f1c40f; color: #2c3e50; border: 1px solid #d4ac0d; }
        .card-white { background-color: #ecf0f1; color: #2c3e50; border: 1px solid #bdc3c7; }
        .card-gray { background-color: #7f8c8d; color: #fff; border: 1px solid #626567; }
        
        /* Hint Matrix for Self Cards */
        .hint-matrix { display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px; width: 100%; font-size: 0.5rem; position: absolute; bottom: 2px; padding: 0 2px; }
        .hint-item { text-align: center; background: rgba(255,255,255,0.2); border-radius: 1px; color: white; }
        .crossed { text-decoration: line-through; opacity: 0.25; }
        
        .action-btn { cursor: pointer; transition: transform 0.1s ease; }
        .action-btn:hover { transform: scale(1.05); }
    </style>
</head>
<body class="bg-main-dark h-100 flex flex-column">

    <div id="login" class="screen active pa4 flex flex-column items-center justify-center vh-100">
        <h1 class="f2 mb3">Hanab Online</h1>
        <p class="f5 mb4 o-70">Cooperative multiplayer card game</p>
        <div class="bg-black-50 pa4 br3 shadow-2 flex flex-column">
            <input id="p-id" class="input-reset ba b--black-20 pa2 mb3 db w-100 br2 bg-near-white dark-gray" placeholder="Enter Player ID (e.g., 0, 1...)">
            <button onclick="connect()" class="button-reset b ph3 pv2 input-reset ba b--transparent bg-blue white pointer br2 f5">Connect</button>
        </div>
    </div>

    <div id="lobby" class="screen pa4 flex flex-column items-center justify-center vh-100">
        <div class="bg-black-50 pa4 br3 shadow-2 tc">
            <h2 class="f3 mb3">Game Lobby</h2>
            <p class="mb4 o-70">Waiting for players to join...</p>
            <button onclick="action('start_game')" class="button-reset b ph4 pv3 bg-green white pointer br2 f4 shadow-1">Start Game</button>
        </div>
    </div>

    <div id="game-area" class="screen flex flex-column h-100 w-100">
        <div class="bg-black-50 pa2 ph4 flex justify-between items-center bb b--black-20">
            <div><span id="score" class="f6 f5-l ttu fwb">Hanab • Score: 0 / 25</span></div>
            <div id="stats" class="f6 f5-l o-90">Lives: 3 | Hints: 8</div>
        </div>

        <div class="pa3 flex flex-row justify-between items-center bg-black-20">
            <div>
                <span class="f7 o-60 db mb1">Fireworks</span>
                <div id="fireworks" class="flex flex-row"></div>
            </div>
            <div class="flex items-center">
                <div class="tc mr3">
                    <div id="deck-count" class="f4 fwbold">0</div>
                    <span class="f7 o-60">deck</span>
                </div>
            </div>
        </div>

        <div id="players-area" class="flex-grow-1 overflow-y-scroll pa3"></div>

        <div id="logs" class="pa2 bg-black-40 f7 o-80 h3 overflow-y-scroll"></div>
    </div>

    <script>
        let socket, myId;

        function showScreen(screenId) {
            document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
            document.getElementById(screenId).classList.add('active');
        }

        function connect() {
            const idVal = document.getElementById('p-id').value;
            if (!idVal) return alert("Please enter a Player ID");
            myId = parseInt(idVal);

            socket = new WebSocket(`ws://localhost:8000/ws/${myId}`);

            socket.onmessage = (e) => {
                try {
                    const data = JSON.parse(e.data);
                    
                    if (data.type === "MODE_UPDATE") {
                        showScreen(data.status === 'lobby' ? 'lobby' : 'game-area');
                    } else if (data.type === "STATE_UPDATE") {
                        render(data.state);
                    }
                } catch (err) {
                    console.error("Error parsing message:", err);
                }
            };
        }

        function action(type, extra = {}) {
            socket.send(JSON.stringify({action: type, ...extra}));
        }

        function createHintMatrix(card) {
            const container = document.createElement('div');
            container.className = 'hint-matrix';
            const colors = card.eliminated_colors || [];
            const ranks = card.eliminated_ranks || [];

            ['Red', 'Blue', 'Green', 'Yellow', 'White'].forEach(c => {
                const div = document.createElement('div');
                div.className = `hint-item ${colors.includes(c) ? 'crossed' : ''}`;
                div.innerText = c[0];
                container.appendChild(div);
            });
            [1, 2, 3, 4, 5].forEach(r => {
                const div = document.createElement('div');
                div.className = `hint-item ${ranks.includes(r) ? 'crossed' : ''}`;
                div.innerText = r;
                container.appendChild(div);
            });
            return container;
        }

        function render(state) {
            document.getElementById('stats').innerText = `Lives: ${state.lives} | Hints: ${state.hints}`;
            document.getElementById('score').innerText = `Hanab • Score: ${state.score} / ${state.max_score}`;
            document.getElementById('deck-count').innerText = state.deck ? state.deck.value : 0;

            // Render Fireworks
            const fw = document.getElementById('fireworks');
            fw.innerHTML = (state.fireworks || []).map(f => 
                `<div class="card-box card-${f[0].toLowerCase()} mr2 shadow-1"><span class="f5">${f[1]}</span></div>`
            ).join('');

            // Render Logs
            if (state.last_actions) {
                document.getElementById('logs').innerHTML = state.last_actions.map(a => `<div>${a}</div>`).join('');
            }

            // Check if it is currently my turn globally
            const isMyTurn = (state.player_turn === myId);

            // Render Hands & Board
            const area = document.getElementById('players-area');
            area.innerHTML = '';

            (state.hands || []).forEach((hand, pIdx) => {
                const isTurn = (pIdx === state.player_turn);
                const isMe = (pIdx === myId);

                const pDiv = document.createElement('div');
                pDiv.className = `mb3 pa3 br2 bg-black-30 ba ${isTurn ? 'b--yellow' : 'b--transparent'}`;
                
                // Player Header with Turn Indicator
                let headerHTML = `<div class="flex justify-between items-center mb2">
                    <div class="flex items-center">`;
                if (isTurn) {
                    headerHTML += `<span class="yellow mr2 fw-bold">➤</span>`;
                }
                headerHTML += `<span class="f5 fw6">${isMe ? 'You (Player ' + pIdx + ')' : 'Player ' + pIdx}</span>`;
                if (isTurn) {
                    headerHTML += `<span class="ml2 f7 bg-yellow dark-gray px1 br1 fw6">Turn</span>`;
                }
                headerHTML += `</div></div>`;
                pDiv.innerHTML = headerHTML;

                // Cards Row
                const row = document.createElement('div');
                row.className = 'flex flex-row flex-wrap gap-2';

                hand.forEach((card) => {
                    const cDiv = document.createElement('div');
                    const displayColor = isMe ? (card.color || 'gray') : card.color;
                    cDiv.className = `card-box card-${displayColor.toLowerCase()} mr2 shadow-1`;
                    cDiv.innerHTML = `<span class="f5">${card.rank || ''}</span>`;
                    
                    if (isMe) {
                        cDiv.appendChild(createHintMatrix(card));
                    }
                    row.appendChild(cDiv);
                });
                pDiv.appendChild(row);

                // --- CONTROLS / ACTION BUTTONS (Only if IT IS MY TURN) ---
                if (isMyTurn) {
                    const controls = document.createElement('div');
                    controls.className = 'mt3 pt2 bt b--black-20 flex flex-wrap items-center';

                    if (isMe) {
                        // Play/Discard buttons for MY own hand when it's my turn
                        controls.innerHTML = `<span class="f6 mr3 o-80">Actions for your hand:</span>`;
                        hand.forEach((_, cIdx) => {
                            const btnGroup = document.createElement('div');
                            btnGroup.className = 'mr3 mb1 flex bg-black-50 br1 overflow-hidden';
                            btnGroup.innerHTML = `
                                <button onclick="action('play_card', {card_ind: ${cIdx}})" class="button-reset bg-green white bn ph2 pv1 pointer f7 action-btn">Play #${cIdx}</button>
                                <button onclick="action('discard_card', {card_ind: ${cIdx}})" class="button-reset bg-red white bn ph2 pv1 pointer f7 action-btn">Discard #${cIdx}</button>
                            `;
                            controls.appendChild(btnGroup);
                        });
                    } else {
                        // Hint buttons under OTHER players' hands when it's my turn
                        controls.innerHTML = `<span class="f6 mr3 o-80">Give Hint to Player ${pIdx}:</span>`;
                        
                        const colorGroup = document.createElement('div');
                        colorGroup.className = 'mr3 mb1 flex gap-1';
                        ['Red', 'Blue', 'Green', 'Yellow', 'White'].forEach(c => {
                            colorGroup.innerHTML += `<button onclick="action('give_hint', {player_ind: ${pIdx}, hint: {color: '${c}'}})" class="button-reset bg-near-white dark-gray ba b--black-20 ph2 pv1 pointer f7 br1 action-btn">${c}</button>`;
                        });
                        controls.appendChild(colorGroup);

                        const rankGroup = document.createElement('div');
                        rankGroup.className = 'mb1 flex gap-1';
                        [1, 2, 3, 4, 5].forEach(r => {
                            rankGroup.innerHTML += `<button onclick="action('give_hint', {player_ind: ${pIdx}, hint: {rank: ${r}}})" class="button-reset bg-near-white dark-gray ba b--black-20 ph2 pv1 pointer f7 br1 action-btn">${r}</button>`;
                        });
                        controls.appendChild(rankGroup);
                    }
                    pDiv.appendChild(controls);
                }

                area.appendChild(pDiv);
            });
        }
    </script>
</body>
</html>
